<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="color-scheme" content="light">
  <title>AI 知识库</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #f6f6f4;
      --panel-strong: #eeeeeb;
      --text: #171717;
      --muted: #777773;
      --faint: #a4a49f;
      --border: #deded9;
      --border-dark: #c4c4be;
      --black: #171717;
      --white: #ffffff;
      --danger: #b42318;
      --success: #157347;
      --warning: #8a6100;
      --radius: 14px;
      --sidebar: 260px;
      --shadow: 0 18px 60px rgba(0, 0, 0, .10);
      --ui-base-font: 14px;
      --ui-reading-font: 15px;
      --ui-small-font: 12px;
      --ui-heading-font: 18px;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    :root[data-font-size="small"] { --ui-base-font: 13px; --ui-reading-font: 14px; --ui-small-font: 11px; --ui-heading-font: 17px; }
    :root[data-font-size="large"] { --ui-base-font: 16px; --ui-reading-font: 17px; --ui-small-font: 14px; --ui-heading-font: 20px; }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #181817; --panel: #222220; --panel-strong: #30302d; --text: #eeeeeb; --muted: #aaa9a3;
      --faint: #777771; --border: #3c3c38; --border-dark: #585852; --black: #eeeeeb; --white: #181817;
      --danger: #f28b82; --success: #6fcf97; --warning: #e6b85c; --shadow: 0 18px 60px rgba(0,0,0,.38);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; color: var(--text); background: var(--bg); overflow: hidden; font-size: var(--ui-base-font); }
    body, .sidebar, .main, .modal, .composer, .source-panel, .folder-panel, .quiz-shell, .quiz-report-shell, .quiz-history-shell { transition: background-color .2s ease, color .2s ease, border-color .2s ease; }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid var(--black); outline-offset: 2px;
    }
    .hidden { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .icon { width: 19px; height: 19px; flex: 0 0 auto; stroke-width: 1.75; }

    .app { height: 100%; display: flex; min-width: 0; }
    .sidebar {
      width: var(--sidebar); flex: 0 0 var(--sidebar); height: 100%; background: var(--panel);
      border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 14px 10px 12px;
      z-index: 30; transition: transform .24s ease, width .24s ease, flex-basis .24s ease;
    }
    .brand { height: 46px; padding: 6px 8px 12px; display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; }
    .brand-mark { width: 29px; height: 29px; border-radius: 8px; background: var(--black); color: white; display: grid; place-items: center; font-size: 12px; letter-spacing: -.02em; }
    .sidebar-nav { display: grid; gap: 3px; padding: 5px 0 13px; border-bottom: 1px solid var(--border); }
    .nav-button, .conversation-item, .folder-nav-item {
      border: 0; background: transparent; width: 100%; min-height: 40px; padding: 9px 10px; border-radius: 9px;
      display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer; transition: background .15s ease;
    }
    .nav-button:hover, .nav-button.active, .conversation-item:hover, .conversation-item.active, .folder-nav-item:hover, .folder-nav-item.active { background: var(--panel-strong); }
    .nav-button.active { font-weight: 650; }
    .sidebar-section-title { padding: 18px 10px 7px; color: var(--muted); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
    .sidebar-search { margin: 2px 5px 8px; min-height: 34px; display: flex; align-items: center; gap: 7px; padding: 0 9px; border: 1px solid var(--border); border-radius: 8px; background: white; color: var(--muted); }
    .sidebar-search .icon { width: 15px; height: 15px; flex: 0 0 auto; }
    .sidebar-search input { min-width: 0; width: 100%; border: 0; outline: 0; background: transparent; font-size: 12px; color: var(--text); }
    .sidebar-search:focus-within { border-color: var(--border-dark); }
    .conversation-list { min-height: 0; overflow-y: auto; padding-bottom: 10px; }
    .conversation-item { position: relative; font-size: 14px; padding-right: 62px; }
    .conversation-item.has-search-result { min-height: 66px; align-items: flex-start; }
    .conversation-item.has-search-result > .icon { margin-top: 2px; }
    .conversation-copy { min-width: 0; flex: 1; display: grid; gap: 4px; }
    .conversation-title { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .conversation-match { min-width: 0; display: flex; align-items: flex-start; gap: 5px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .conversation-match em { flex: 0 0 auto; margin-top: 1px; padding: 0 4px; border-radius: 4px; background: var(--panel-strong); color: var(--faint); font-size: 9px; font-style: normal; line-height: 1.55; }
    .conversation-match > span { min-width: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .conversation-search-highlight { padding: 0 1px; border-radius: 2px; background: #ffe58a; color: #2c260d; font-weight: 650; }
    .conversation-actions { position: absolute; top: 7px; right: 6px; display: flex; opacity: 0; }
    .conversation-item:hover .conversation-actions, .conversation-item.active .conversation-actions { opacity: 1; }
    .conversation-action { width: 25px; height: 25px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
    .conversation-action .icon { width: 15px; height: 15px; }
    .conversation-action:hover { background: #e2e2de; color: var(--text); }
    .conversation-action.danger:hover { color: var(--danger); }
    .rename-input { width: 100%; border: 1px solid var(--border-dark); border-radius: 6px; padding: 4px 6px; background: white; }
    .sidebar-empty { color: var(--muted); font-size: 12px; line-height: 1.65; padding: 10px; }
    .sidebar-settings { margin-top: auto; border: 0; border-top: 1px solid var(--border); border-radius: 0; background: transparent; min-height: 43px; padding: 10px 8px 7px; display: flex; align-items: center; gap: 8px; color: var(--text); cursor: pointer; text-align: left; }
    .sidebar-settings:hover { color: var(--black); background: var(--panel-strong); border-radius: 8px; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.32); z-index: 25; }

    .main { min-width: 0; flex: 1; height: 100%; display: flex; flex-direction: column; background: var(--bg); }
    .topbar { min-height: 58px; padding: 0 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid transparent; flex: 0 0 auto; }
    .topbar.bordered { border-bottom-color: var(--border); }
    .topbar-title { min-width: 0; flex: 1; font-size: 14px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-action, .icon-button {
      border: 1px solid var(--border); background: white; min-height: 36px; border-radius: 9px; padding: 7px 11px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer;
    }
    .topbar-action:hover, .icon-button:hover { background: var(--panel); }
    .icon-button { width: 36px; padding: 0; }
    .sidebar-toggle { display: none; }
    .primary-button, .secondary-button, .danger-button {
      border: 1px solid var(--black); background: var(--black); color: white; min-height: 38px; border-radius: 9px; padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600;
    }
    .primary-button:hover { background: #2d2d2d; }
    .primary-button:disabled, .secondary-button:disabled { opacity: .45; cursor: not-allowed; }
    .secondary-button { background: white; color: var(--text); border-color: var(--border-dark); }
    .secondary-button:hover { background: var(--panel); }
    .danger-button { background: var(--danger); border-color: var(--danger); }
    .text-button { border: 0; background: transparent; padding: 6px 3px; color: var(--muted); cursor: pointer; }
    .text-button:hover { color: var(--text); }

    .chat-view { min-height: 0; flex: 1; display: flex; flex-direction: column; }
    .chat-layout { min-height: 0; flex: 1; display: flex; }
    .chat-column { min-width: 0; flex: 1; display: flex; flex-direction: column; }
    .empty-chat { min-height: 0; flex: 1; display: flex; align-items: center; justify-content: center; padding: 28px 22px 9vh; }
    .empty-chat-inner { width: min(760px, 100%); }
    .hello { font-size: clamp(31px, 4vw, 48px); letter-spacing: -.04em; margin: 0 0 28px; font-weight: 500; text-align: center; }
    .messages { flex: 1; min-height: 0; overflow-y: auto; padding: 28px 20px 14px; }
    .message-list { width: min(820px, 100%); margin: 0 auto; display: grid; gap: 28px; }
    .message-row { display: flex; min-width: 0; }
    .message-row.user { justify-content: flex-end; }
    .message-bubble { max-width: min(82%, 680px); font-size: 15px; line-height: 1.75; min-width: 0; }
    .message-row.user .message-bubble { background: var(--panel-strong); padding: 10px 15px; border-radius: 17px 17px 4px 17px; white-space: pre-wrap; }
    .message-row.assistant .message-bubble { width: 100%; max-width: 100%; }
    .message-bubble, .parsed-text, .original-document { font-size: var(--ui-reading-font); }
    .conversation-item, .topbar-title, .folder-nav-item, .file-name-button, .option-button, .dialog-message, .detail-body { font-size: var(--ui-base-font); }
    .assistant-label, .source-toggle, .source-fragment-text, .file-size, .file-date, .file-insights p, .quiz-metrics, .history-date, .sidebar-section-title, .sidebar-search input { font-size: var(--ui-small-font); }
    .answer-heading, .question-text, .wrong-book-card h2, .report-section h2 { font-size: var(--ui-heading-font); }
    .conversation-item, .folder-nav-item, .message-bubble, .kb-content-inner { transition: background-color .2s ease, border-color .2s ease, color .2s ease, box-shadow .2s ease; }
    .view-enter { animation: view-enter .24s cubic-bezier(.2,.7,.2,1) both; }
    .folder-content-enter { animation: folder-content-enter .22s cubic-bezier(.2,.7,.2,1) both; }
    .message-enter { animation: message-enter .28s cubic-bezier(.2,.75,.25,1) both; }
    @keyframes view-enter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes folder-content-enter { from { opacity: 0; transform: translateX(7px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes message-enter { from { opacity: 0; transform: translateY(8px) scale(.995); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .view-enter, .folder-content-enter, .message-enter { animation: none; }
      .conversation-item, .folder-nav-item, .message-bubble, .kb-content-inner { transition: none; }
    }
    .assistant-label { font-size: 12px; color: var(--muted); margin: 0 0 7px; display: flex; align-items: center; gap: 7px; }
    .answer p { margin: 0 0 11px; }
    .answer p:last-child { margin-bottom: 0; }
    .answer-heading { font-size: 16px; font-weight: 700; margin: 17px 0 8px; }
    .answer-bullet { display: flex; gap: 9px; margin: 5px 0; }
    .answer-bullet::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--text); margin-top: .7em; flex: 0 0 auto; }
    .thinking { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); padding: 8px 0; }
    .thinking-dots { display: inline-flex; gap: 4px; }
    .thinking-dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: bounce 1.1s infinite ease-in-out; }
    .thinking-dots i:nth-child(2) { animation-delay: .15s; }
    .thinking-dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%, 65%, 100% { transform: translateY(0); opacity: .4; } 35% { transform: translateY(-4px); opacity: 1; } }
    .error-card { padding: 13px 14px; border: 1px solid #e7c5c1; background: #fff8f7; border-radius: 10px; color: #712018; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .error-card span { flex: 1; min-width: 220px; }
    .source-toggle { margin-top: 14px; border: 1px solid var(--border); background: white; color: var(--muted); border-radius: 8px; padding: 6px 9px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; }
    .source-toggle:hover { color: var(--text); background: var(--panel); }
    .source-toggle .icon { width: 15px; height: 15px; }
    .source-toggle strong { min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; background: var(--panel-strong); display: grid; place-items: center; font-size: 10px; }
    .source-panel { width: 350px; flex: 0 0 350px; min-height: 0; border-left: 1px solid var(--border); background: #fafaf9; display: flex; flex-direction: column; }
    .source-panel-header { min-height: 64px; padding: 12px 14px 12px 17px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .source-panel-header > div { min-width: 0; flex: 1; display: grid; gap: 2px; }
    .source-panel-header strong { font-size: 14px; }
    .source-panel-header span { color: var(--muted); font-size: 11px; }
    .source-fragments { min-height: 0; overflow-y: auto; padding: 12px; display: grid; align-content: start; gap: 10px; }
    .source-fragment { width: 100%; border: 1px solid var(--border); background: white; border-radius: 11px; padding: 12px; display: grid; grid-template-columns: 25px minmax(0, 1fr); gap: 5px 8px; cursor: pointer; text-align: left; }
    .source-fragment:hover { border-color: var(--border-dark); box-shadow: 0 5px 18px rgba(0,0,0,.05); }
    .source-fragment-index { grid-row: 1 / span 3; color: var(--faint); font-size: 10px; padding-top: 2px; }
    .source-fragment-meta { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11px; }
    .source-fragment-text { color: #383834; font-size: 12px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
    .source-original-page { grid-column: 2; min-width: 0; margin-top: 3px; display: block; overflow: hidden; border: 1px solid var(--border); border-radius: 7px; background: #e8e8e5; }
    .source-original-loading, .source-original-error { min-height: 90px; padding: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 11px; text-align: center; }
    .source-original-loading .loader { width: 17px; height: 17px; border-width: 2px; }
    .pdf-citation-original { min-height: 330px; display: grid; place-items: center; }
    .pdf-original-page-label { display: block; width: 100%; padding: 7px 9px; background: #f4f4f1; color: #5b5b55; font-size: 11px; text-align: left; }
    .pdf-original-shell { position: relative; display: block; margin: 0 auto; overflow: hidden; background: white; box-shadow: 0 2px 10px rgba(0,0,0,.13); }
    .pdf-original-shell.compact { box-shadow: none; }
    .pdf-original-canvas { position: absolute; inset: 0; display: block; }
    .pdf-highlight-layer { position: absolute; inset: 0; display: block; pointer-events: none; }
    .pdf-highlight-box { position: absolute; display: block; border-radius: 2px; background: rgba(71, 138, 238, .34); box-shadow: inset 0 0 0 1px rgba(37, 99, 191, .22); mix-blend-mode: multiply; }
    .pdf-highlight-box.keyword { background: rgba(255, 213, 49, .58); box-shadow: inset 0 0 0 1px rgba(163, 124, 0, .28); }
    .pdf-highlight-box.citation.keyword { background: rgba(255, 188, 35, .55); }
    .original-citation-block { margin-inline: -5px !important; padding: 4px 5px !important; border-radius: 4px; background: #fff0a8; box-shadow: inset 3px 0 #d49d00; }
    .citation-passage { margin: 0 -2px; padding: 1px 2px; border-radius: 4px; background: #e8f1ff; color: #172f54; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
    .keyword-highlight { padding: 0 2px; border-radius: 3px; background: #fff0a8; color: #29230b; }

    .composer-wrap { width: min(820px, calc(100% - 40px)); margin: 0 auto; padding: 10px 0 22px; position: relative; }
    .composer { border: 1px solid var(--border-dark); border-radius: 17px; background: white; padding: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.06); }
    .composer textarea { width: 100%; min-height: 44px; max-height: 180px; resize: none; border: 0; outline: 0; padding: 3px 5px 8px; line-height: 1.55; color: var(--text); background: transparent; }
    .composer textarea::placeholder { color: var(--faint); }
    .composer-footer { display: flex; align-items: flex-end; gap: 8px; min-height: 34px; }
    .knowledge-picker { flex: 1; min-width: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; position: relative; }
    .picker-trigger { border: 0; background: transparent; color: var(--muted); cursor: pointer; min-height: 32px; padding: 5px 7px; display: inline-flex; align-items: center; gap: 6px; border-radius: 7px; }
    .picker-trigger:hover { background: var(--panel); color: var(--text); }
    .model-picker { position: relative; flex: 0 0 auto; }
    .model-trigger { min-height: 32px; max-width: 125px; padding: 5px 7px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
    .model-trigger:hover { background: var(--panel); color: var(--text); }
    .model-trigger span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--ui-small-font); }
    .model-trigger .icon { width: 15px; height: 15px; }
    .model-picker-menu { position: absolute; right: 0; bottom: 39px; z-index: 21; width: 230px; padding: 6px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); box-shadow: var(--shadow); display: grid; gap: 3px; }
    .model-picker-section-label { padding: 5px 9px 3px; color: var(--muted); font-size: 10px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; }
    .model-picker-divider { height: 1px; background: var(--border); margin: 4px 3px; }
    .model-picker-option { min-height: 38px; padding: 7px 9px; border: 0; border-radius: 7px; background: transparent; display: flex; align-items: center; gap: 8px; cursor: pointer; text-align: left; }
    .model-picker-option:hover, .model-picker-option.active { background: var(--panel-strong); }
    .model-picker-option span { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .model-picker-option .icon { width: 15px; height: 15px; }
    .model-config-option { color: var(--muted); }
    .knowledge-tag { display: inline-flex; align-items: center; gap: 5px; max-width: 150px; min-height: 28px; padding: 4px 7px 4px 9px; border-radius: 7px; background: var(--panel-strong); font-size: 12px; }
    .knowledge-tag span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag-remove { border: 0; background: transparent; width: 18px; height: 18px; padding: 0; cursor: pointer; color: var(--muted); border-radius: 4px; }
    .tag-remove:hover { background: #d8d8d3; color: var(--text); }
    .send-button { border: 0; width: 34px; height: 34px; flex: 0 0 auto; border-radius: 50%; background: var(--black); color: white; cursor: pointer; display: grid; place-items: center; }
    .send-button:disabled { background: #c9c9c4; cursor: not-allowed; }
    .stop-button { min-height: 34px; flex: 0 0 auto; border: 1px solid #d2aaa6; border-radius: 9px; padding: 6px 10px; display: inline-flex; align-items: center; gap: 6px; background: #fff7f6; color: var(--danger); cursor: pointer; font-size: 12px; }
    .stop-button:hover { background: #ffefed; }
    .stop-button .icon { width: 14px; height: 14px; }
    .streaming-answer::after { content: ""; display: inline-block; width: 2px; height: 1em; margin-left: 3px; vertical-align: -.12em; background: currentColor; animation: cursor-blink .8s steps(1) infinite; }
    @keyframes cursor-blink { 50% { opacity: 0; } }
    .picker-menu { position: absolute; left: 0; bottom: 38px; z-index: 20; width: min(320px, 80vw); max-height: 280px; overflow-y: auto; padding: 7px; background: white; border: 1px solid var(--border); border-radius: 11px; box-shadow: var(--shadow); }
    .picker-menu-title { padding: 7px 9px 8px; font-size: 12px; color: var(--muted); }
    .picker-option { width: 100%; border: 0; background: transparent; padding: 9px; border-radius: 7px; display: flex; align-items: center; gap: 9px; cursor: pointer; text-align: left; }
    .picker-option:hover { background: var(--panel); }
    .picker-option input { accent-color: var(--black); }
    .picker-empty { color: var(--muted); padding: 13px 10px; font-size: 13px; }

    .knowledge-view { min-height: 0; flex: 1; display: flex; }
    .folder-panel { width: 244px; flex: 0 0 244px; background: #fbfbfa; border-right: 1px solid var(--border); padding: 13px 10px; overflow-y: auto; }
    .folder-panel-head { padding: 3px 8px 12px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 650; }
    .folder-nav-item { font-size: 13px; position: relative; padding-right: 63px; }
    .folder-nav-item .folder-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .folder-count { color: var(--muted); font-size: 11px; }
    .folder-quick { position: absolute; right: 6px; display: flex; opacity: 0; }
    .folder-nav-item:hover .folder-quick, .folder-nav-item.active .folder-quick { opacity: 1; }
    .mini-button { width: 25px; height: 25px; padding: 0; border: 0; background: transparent; display: grid; place-items: center; border-radius: 6px; cursor: pointer; color: var(--muted); }
    .mini-button:hover { background: #ddddda; color: var(--text); }
    .mini-button.danger:hover { color: var(--danger); }
    .kb-content { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; padding: 30px clamp(22px, 4vw, 56px) 60px; }
    .kb-content-inner { width: min(980px, 100%); margin: 0 auto; }
    .content-heading { display: flex; align-items: flex-start; gap: 18px; margin-bottom: 25px; }
    .content-heading-text { flex: 1; min-width: 0; }
    .content-heading h1 { margin: 0 0 6px; font-size: 25px; letter-spacing: -.025em; }

    .option-list { display: grid; gap: 10px; }

    .short-answer-field { display: grid; gap: 9px; }

    .short-answer-field textarea { width: 100%; min-height: 170px; resize: vertical; border: 1px solid var(--border-dark); border-radius: 10px; padding: 13px 14px; background: var(--bg); color: var(--text); font: inherit; line-height: 1.7; outline: 0; transition: border-color .16s ease, box-shadow .16s ease; }

    .quiz-actions { display: flex; gap: 9px; margin-top: 25px; }
    .loader.small { width: 15px; height: 15px; border-width: 2px; display: inline-block; margin-right: 7px; vertical-align: -2px; }
    .explanation { margin-top: 27px; border-top: 1px solid var(--border); padding-top: 22px; line-height: 1.7; }
    .result-line { font-weight: 700; margin-bottom: 9px; }

    .short-grade-result { display: grid; gap: 5px; }
    .reference-answer { margin: 10px 0 4px; padding: 12px 14px; border: 1px solid color-mix(in srgb, var(--success) 42%, var(--border)); border-radius: 9px; background: color-mix(in srgb, var(--success) 8%, var(--bg)); }

    .explanation-source { border: 0; background: var(--panel); border-radius: 7px; padding: 7px 9px; cursor: pointer; text-align: left; }
    .quiz-footer { border-top: 1px solid var(--border); padding: 13px 24px; display: flex; justify-content: space-between; }
    .quiz-report-shell, .quiz-history-shell { padding: clamp(23px, 5vw, 46px); }
    .report-title { margin: 0 0 23px; font-size: 24px; }
    .report-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .metric-card { background: var(--panel); border-radius: 10px; padding: 15px; }
    .metric-label { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
    .metric-value { font-size: 20px; font-weight: 700; }
    .rating { margin: 18px 0 26px; padding: 13px 15px; border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: space-between; }
    .report-section { border-top: 1px solid var(--border); padding-top: 21px; margin-top: 21px; }

    .wrong-list { display: grid; gap: 8px; }
    .wrong-item, .history-item { border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; }
    .wrong-item { display: flex; align-items: center; gap: 12px; font-size: 13px; }
    .wrong-item strong { flex: 0 0 auto; }
    .wrong-item span { flex: 1; }
    .wrong-report-item { border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: var(--bg); }
    .wrong-report-item summary { display: flex; align-items: center; gap: 12px; padding: 13px 14px; cursor: pointer; list-style: none; font-size: 13px; }
    .wrong-report-item summary::-webkit-details-marker { display: none; }

    .report-review-option.correct { border-color: var(--success); background: color-mix(in srgb, var(--success) 12%, var(--bg)); }
    .report-review-option.selected-wrong { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, var(--bg)); }
    .quiz-ai-button { flex: 0 0 auto; white-space: nowrap; }
    .report-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 28px; }
    details.explanation-item { border: 1px solid var(--border); border-radius: 9px; padding: 11px 13px; margin-bottom: 8px; }
    details.explanation-item summary { cursor: pointer; font-weight: 650; line-height: 1.5; }
    .detail-body { color: #4c4c48; font-size: 13px; line-height: 1.7; padding: 11px 0 3px; }
    .history-header { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
    .history-header h1 { flex: 1; margin: 0; font-size: 23px; }
    .history-list { display: grid; gap: 10px; }
    .history-item { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 90px 90px auto 36px; gap: 15px; align-items: center; cursor: pointer; background: white; text-align: left; }
    .history-item:hover { border-color: var(--border-dark); background: #fbfbfa; }
    .history-delete { width: 34px; height: 34px; color: var(--muted); }
    .history-delete:hover { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); background: color-mix(in srgb, var(--danger) 8%, var(--bg)); }
    .history-folder { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-date { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .accuracy-bar { width: 90px; height: 5px; border-radius: 99px; background: var(--panel-strong); overflow: hidden; margin-top: 6px; }
    .accuracy-bar i { display: block; height: 100%; background: var(--black); }


    .toast-region { position: fixed; z-index: 200; right: 20px; bottom: 20px; display: grid; gap: 8px; pointer-events: none; }
    .toast { max-width: min(370px, calc(100vw - 40px)); background: #222; color: white; border-radius: 9px; padding: 11px 14px; font-size: 13px; line-height: 1.5; box-shadow: var(--shadow); animation: toast-in .2s ease; }
    .toast.error { background: #79251e; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(7px); } }

    .app.auth-hidden { visibility: hidden; }
    .auth-screen { position: fixed; inset: 0; z-index: 300; display: grid; place-items: center; padding: 20px; background: radial-gradient(circle at 50% 15%, #f4f4f0 0, var(--bg) 58%); }
    .auth-card { width: min(420px, 100%); padding: 28px; border: 1px solid var(--border); border-radius: 17px; background: var(--bg); box-shadow: var(--shadow); }
    .auth-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; }
    .auth-brand > div { display: grid; gap: 3px; }
    .auth-brand strong { font-size: 20px; }
    .auth-brand span:not(.brand-mark) { color: var(--muted); font-size: 12px; }
    .auth-tabs { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; margin-bottom: 21px; border-radius: 10px; background: var(--panel); }
    .auth-tabs button { min-height: 38px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; color: var(--muted); }
    .auth-tabs button.active { background: var(--bg); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.06); font-weight: 650; }
    [data-auth-form] { display: grid; gap: 15px; }
    [data-auth-form] label { display: grid; gap: 7px; color: var(--muted); font-size: 12px; font-weight: 650; }
    [data-auth-form] input { width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--border-dark); border-radius: 9px; background: var(--bg); color: var(--text); }
    .auth-submit { width: 100%; margin-top: 4px; }
    .auth-error { margin: -4px 0 0; padding: 9px 11px; border-radius: 8px; background: #fff0ee; color: var(--danger); font-size: 12px; line-height: 1.5; }
    :root[data-theme="dark"] .auth-screen { background: radial-gradient(circle at 50% 15%, #292926 0, var(--bg) 58%); }
    :root[data-theme="dark"] .auth-error { background: #3a2220; }

    @media (max-width: 1023px) {
      .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); box-shadow: var(--shadow); }
      .app.sidebar-open .sidebar { transform: translateX(0); }
      .app.sidebar-open .sidebar-overlay { display: block; }
      .sidebar-toggle { display: inline-flex; }
      .file-row { grid-template-columns: minmax(0, 1fr) 100px auto; }
      .file-date { display: none; }
      .source-panel { width: 320px; flex-basis: 320px; }
      .report-summary { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 767px) {
      .topbar { padding: 0 12px; min-height: 54px; }
      .conversation-actions { opacity: 1; }
      .topbar-action .button-label { display: none; }
      .composer-wrap { width: calc(100% - 22px); padding-bottom: max(12px, env(safe-area-inset-bottom)); }
      .stop-button span { display: none; }
      .export-format-list { grid-template-columns: 1fr; }
      .empty-chat { padding-inline: 11px; }
      .messages { padding: 18px 12px 10px; }
      .message-list { gap: 22px; }
      .message-bubble { max-width: 91%; }
      .message-row.assistant .message-bubble { max-width: 100%; }
      .source-panel { position: fixed; z-index: 24; top: 54px; right: 0; bottom: 0; width: min(92vw, 360px); box-shadow: var(--shadow); }
      .quiz-view, .quiz-report-view, .quiz-history-view, .quiz-mode-view, .wrong-book-view { padding: 12px 10px 40px; }
      .quiz-shell, .quiz-report-shell, .quiz-history-shell { border-radius: 11px; }
      .question-area { padding: 24px 18px; }
      .quiz-header, .quiz-footer { padding-inline: 18px; }
      .history-item { grid-template-columns: minmax(0, 1fr) auto auto; }
      .history-item > :nth-child(2), .history-item > :nth-child(3) { display: none; }
      .quiz-mode-header, .quiz-folder-card, .wrong-book-header { align-items: stretch; flex-direction: column; }
      .quiz-mode-header-actions, .wrong-book-actions { justify-content: stretch; }
      .quiz-mode-header-actions button, .wrong-book-actions button { flex: 1; }
      .quiz-folder-actions { width: 100%; }
      .quiz-folder-actions button { flex: 1; }
      .wrong-summary, .wrong-option-review { grid-template-columns: 1fr; }
      .wrong-book-filter { align-items: stretch; flex-wrap: wrap; }
      .wrong-book-search { flex-basis: calc(100% - 46px); }
      .wrong-book-actions .add-wrong-button { flex: 0 0 42px; }
      .custom-option-grid, .custom-wrong-meta-grid { grid-template-columns: 1fr; }
      .knowledge-view { display: block; overflow-y: auto; }
      .folder-panel { width: 100%; height: auto; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 9px; display: flex; gap: 5px; }
      .folder-panel-head { min-width: max-content; padding: 8px; }
      .folder-nav-item { width: auto; min-width: 170px; padding-right: 60px; }
      .kb-content { overflow: visible; padding: 22px 14px 50px; }
      .content-heading { display: block; }
      .heading-actions { justify-content: flex-start; margin-top: 15px; }
      .file-row { grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
      .file-size { display: none; }
      .status { font-size: 0; padding: 7px; }
      .status::before { width: 7px; height: 7px; }
      .modal-layer { padding: 10px; align-items: flex-end; }
      .modal { max-height: calc(100vh - 20px); border-radius: 15px 15px 10px 10px; }
      .preview-content { min-height: 45vh; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" aria-label="侧边栏">
      <div class="brand"><span class="brand-mark">AI</span><span>知识库</span></div>
